<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AR Furniture Viewer</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- AR.js untuk A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Styling terpisah -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; patternRatio: 0.5; debugUIEnabled: false; detectionMode: mono;"
  >
    <!-- ===== MARKER: LEMARI ===== -->
    <a-marker type="pattern" url="asset/patterns/pattern-marker-lemari.patt" id="marker-lemari">
      <a-entity
        id="furnitur-lemari"
        gltf-model="asset/models/lemari.glb"
        scale="0.5 0.5 0.5"
        position="0 1 0"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <!-- ===== MARKER: MEJA ===== -->
    <a-marker type="pattern" url="asset/patterns/pattern-marker-meja.patt" id="marker-meja">
      <a-entity
        id="furnitur-meja"
        gltf-model="asset/models/meja.glb"
        scale="0.5 0.5 0.5"
        position="0 1 0"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <!-- ===== MARKER: SOFA ===== -->
    <a-marker type="pattern" url="asset/patterns/pattern-marker-sofa.patt" id="marker-sofa">
      <a-entity
        id="furnitur-sofa"
        gltf-model="asset/models/sofa.glb"
        scale="0.5 0.5 0.5"
        position="0 1 0"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <!-- ===== TAMBAH MARKER BARU DI SINI (contoh) =====
    <a-marker type="pattern" url="asset/patterns/pattern-marker-NAMA.patt" id="marker-NAMA">
      <a-entity
        id="furnitur-NAMA"
        gltf-model="asset/models/NAMA.glb"
        scale="0.05 0.05 0.05"
        position="0 0 0"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>
    ================================================== -->

    <a-entity camera></a-entity>
  </a-scene>

  <main class="ar-ui" aria-label="Furniture AR viewer">
    <div class="topbar">
      <button class="icon-button" type="button" id="close-button" aria-label="Help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9a2.4 2.4 0 1 1 3.8 2c-1 .7-1.5 1.2-1.5 2.5M12 16.8h.01"/></svg>
      </button>
    </div>

    <div class="status-message" id="status" role="status" aria-live="polite"></div>

    <section class="scene-help" aria-live="polite">
      <p>Arahkan kamera ke salah satu marker: Lemari, Meja, atau Sofa</p>
      <div class="placement-frame" aria-hidden="true"></div>
    </section>

    <div class="selection-sheet" id="selection-sheet" aria-label="Furniture choices">
      <button class="active" type="button" data-furnitur="lemari">Lemari</button>
      <button type="button" data-furnitur="meja">Meja</button>
      <button type="button" data-furnitur="sofa">Sofa</button>
      <!-- Tambah tombol baru di sini kalau nambah furniture -->
    </div>

    <nav class="bottom-controls" aria-label="AR controls">
      <button class="round-button" type="button" aria-label="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 8 5 12l4 4"/><path d="M6 12h7a5 5 0 1 1 0 10h-1"/></svg>
      </button>
      <button class="primary-control" id="place-button" type="button" aria-label="Place furniture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6.5 12.5 10 16l7.5-8"/></svg>
      </button>
      <button class="round-button" type="button" id="more-button" aria-label="Choose furniture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="6" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="18" cy="12" r="1" fill="currentColor"/></svg>
      </button>
    </nav>
  </main>

  <!-- Logic aplikasi terpisah -->
  <script src="app.js"></script>
</body>
</html>
